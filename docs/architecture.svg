<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#555;stroke-width:1.2;rx:8}
      .yt{fill:#f3ecff;stroke:#7b3fe4}
      .gl{fill:#fff1e8;stroke:#e2432a}
      .ops{fill:#eef6ee;stroke:#2e7d32}
      .ppl{fill:#eef3fb;stroke:#2f6fdb}
      .t{font-weight:600;font-size:14px}
      .s{fill:#555;font-size:12px}
      .l{stroke:#444;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .d{stroke:#444;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .lbl{fill:#333;font-size:11.5px}
    </style>
  </defs>
  <text x="20" y="30" font-size="18" font-weight="700">DevOps Demand Management POC - architecture (single Docker host, on-prem)</text>

  <!-- people -->
  <rect class="box ppl" x="20" y="60" width="200" height="70"/>
  <text class="t" x="35" y="85">Squad developers</text>
  <text class="s" x="35" y="105">request forms, follow status</text>
  <text class="s" x="35" y="121">(DevOps Requester role)</text>
  <rect class="box ppl" x="20" y="150" width="200" height="70"/>
  <text class="t" x="35" y="175">DevOps team</text>
  <text class="s" x="35" y="195">triage, board, implementation</text>
  <text class="s" x="35" y="211">(project team)</text>
  <rect class="box ppl" x="20" y="240" width="200" height="60"/>
  <text class="t" x="35" y="265">Management</text>
  <text class="s" x="35" y="285">demand dashboard</text>

  <!-- docker host -->
  <rect x="260" y="50" width="820" height="630" rx="12" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
  <text x="275" y="72" class="s">docker compose project "devops-poc" - network "devops-poc" - named volumes</text>

  <!-- YouTrack -->
  <rect class="box yt" x="285" y="90" width="360" height="300"/>
  <text class="t" x="300" y="115">YouTrack Server  (jetbrains/youtrack)  :8080</text>
  <text class="s" x="300" y="135">embedded DB + Hub - volumes data/conf/logs/backups</text>
  <rect class="box" x="300" y="148" width="330" height="58"/>
  <text x="312" y="167" font-weight="600">Project DEVOPS</text>
  <text class="s" x="312" y="184">Demand/Bug/Improvement - Squad, Service, Priority,</text>
  <text class="s" x="312" y="199">State, Blocked*, GitLab refs, Requested On, Aging</text>
  <rect class="box" x="300" y="214" width="330" height="58"/>
  <text x="312" y="233" font-weight="600">App "devops-demand" (workflows + widget)</text>
  <text class="s" x="312" y="250">templates, intake-&gt;Triage, P1/P2 notify, Blocked/Done</text>
  <text class="s" x="312" y="265">guards, aging (hourly), KPI dashboard widget</text>
  <rect class="box" x="300" y="280" width="160" height="50"/>
  <text x="312" y="300" font-weight="600">Kanban board</text>
  <text class="s" x="312" y="318">Triage..Done</text>
  <rect class="box" x="470" y="280" width="160" height="50"/>
  <text x="482" y="300" font-weight="600">Dashboard</text>
  <text class="s" x="482" y="318">KPIs + 8 reports + lists</text>
  <rect class="box" x="300" y="338" width="330" height="40"/>
  <text x="312" y="363" font-weight="600">VCS integration "GitLab" (built-in)</text>

  <!-- GitLab -->
  <rect class="box gl" x="700" y="90" width="360" height="300"/>
  <text class="t" x="715" y="115">GitLab CE  (gitlab/gitlab-ce)  :8929</text>
  <text class="s" x="715" y="135">bundled PostgreSQL, Redis, Gitaly - 3 volumes</text>
  <rect class="box" x="715" y="148" width="330" height="58"/>
  <text x="727" y="167" font-weight="600">group platform / ci-templates</text>
  <text class="s" x="727" y="184">issue -&gt; branch DEVOPS-n -&gt; commit -&gt; MR</text>
  <text class="s" x="727" y="199">.gitlab-ci.yml: test, build, deploy, smoke, report</text>
  <rect class="box" x="715" y="214" width="330" height="58"/>
  <text x="727" y="233" font-weight="600">Integration "YouTrack" (built-in)</text>
  <text class="s" x="727" y="250">DEVOPS-123 in issues/MRs/commits -&gt; links</text>
  <text class="s" x="727" y="265">to the YouTrack request</text>
  <rect class="box" x="715" y="280" width="330" height="50"/>
  <text x="727" y="300" font-weight="600">Webhook (registered by YouTrack)</text>
  <text class="s" x="727" y="318">push + MR events -&gt; /api/vcsHooksReceiver</text>
  <rect class="box" x="715" y="338" width="330" height="40"/>
  <text x="727" y="363" font-weight="600">group CI/CD variables: YOUTRACK_URL/TOKEN</text>

  <!-- runner, demo app, mailpit -->
  <rect class="box ops" x="700" y="430" width="360" height="90"/>
  <text class="t" x="715" y="455">GitLab Runner (docker executor)</text>
  <text class="s" x="715" y="475">job containers on network devops-poc</text>
  <text class="s" x="715" y="491">youtrack-sync job -&gt; YouTrack REST API (gitlab.bot)</text>
  <text class="s" x="715" y="507">deploy job -&gt; volume devops-poc-demo-app-www</text>
  <rect class="box ops" x="700" y="560" width="170" height="90"/>
  <text class="t" x="712" y="585">demo-app (nginx)</text>
  <text class="s" x="712" y="605">:8088 "demo" env</text>
  <text class="s" x="712" y="621">deployment target</text>
  <rect class="box ops" x="890" y="560" width="170" height="90"/>
  <text class="t" x="902" y="585">Mailpit</text>
  <text class="s" x="902" y="605">SMTP sink :1025</text>
  <text class="s" x="902" y="621">web UI :8025</text>
  <rect class="box ops" x="285" y="430" width="360" height="90"/>
  <text class="t" x="300" y="455">setup job (python stdlib, profile "tools")</text>
  <text class="s" x="300" y="475">REST-only configuration: youtrack, gitlab, seed,</text>
  <text class="s" x="300" y="491">lifecycle (end-to-end demo), verify (26 checks)</text>
  <text class="s" x="300" y="507">scripts/setup.sh | backup.sh | restore.sh | reset.sh</text>
  <rect class="box ops" x="285" y="560" width="360" height="90"/>
  <text class="t" x="300" y="585">youtrack-loopback (nginx in YouTrack's netns)</text>
  <text class="s" x="300" y="605">+ loopback server block in GitLab's nginx:</text>
  <text class="s" x="300" y="621">public localhost URLs work inside containers</text>
  <text class="s" x="300" y="637">(not needed with real DNS names)</text>

  <!-- arrows people -> yt -->
  <path class="l" d="M220,95 L285,160"/>
  <path class="l" d="M220,185 L285,250"/>
  <path class="l" d="M220,270 L285,300"/>
  <text class="lbl" x="226" y="300">dashboard</text>
  <text class="lbl" x="226" y="120">submit</text>
  <!-- YT <-> GL -->
  <path class="l" d="M630,362 L715,362"/>
  <text class="lbl" x="648" y="372">API</text>
  <path class="l" d="M715,305 L630,330"/>
  <text class="lbl" x="645" y="300">webhook</text>
  <path class="d" d="M715,243 L645,243"/>
  <text class="lbl" x="650" y="236">links</text>
  <!-- runner -->
  <path class="l" d="M880,390 L880,430"/>
  <text class="lbl" x="886" y="414">jobs</text>
  <path class="l" d="M700,490 L645,380"/>
  <text class="lbl" x="600" y="420">pipeline/MR refs,</text>
  <text class="lbl" x="600" y="434">comments (REST)</text>
  <path class="l" d="M785,520 L785,560"/>
  <text class="lbl" x="790" y="545">deploy</text>
  <path class="l" d="M660,375 L672,375 L672,540 L975,540 L975,560"/>
  <text class="lbl" x="880" y="535">P1/P2 e-mail (SMTP)</text>
</svg>
